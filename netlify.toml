# KairoBridge Home Care: Netlify configuration.
# Each deploy runs tools/build.mjs (plain Node, no packages), which rebuilds
# every page from assets/js/config.js. The site root is this folder.

[build]
  publish = "."
  command = "node tools/build.mjs"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # Search engine access is controlled by `indexing` in assets/js/config.js
    # (robots meta tags, robots.txt and sitemap.xml are generated from it).

# Owner planning files must never be served, even if one is copied in by mistake.
[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/tools/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# Design versions. Astro 3 (Bento) is now the home page. The older designs
# stay in their own folders and out of search results even after launch.
[[redirects]]
  from = "/astro-3/*"
  to = "/"
  status = 301

[[headers]]
  for = "/astro-*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/versions/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/compare/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/thank-you/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
